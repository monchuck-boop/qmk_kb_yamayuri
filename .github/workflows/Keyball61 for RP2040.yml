name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # 安定したUbuntu環境を使用します

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # QMKと互換性の高いバージョンを指定

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util

    - name: Install QMK CLI and Dependencies
      run: |
        cd qmk_firmware
        # Python環境にQMK CLIと必要な依存関係（appdirs含む）を確実にインストールします
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        python3 -m pip install appdirs

    - name: Run QMK Compile
      run: |
        cd qmk_firmware
        # Gitの安全なディレクトリ設定を追加
        git config --global --add safe.directory $(pwd)
        # QMK環境のセットアップとコンパイル
        qmk setup -y
        qmk compile -kb keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-firmware
        path: |
          qmk_firmware/*.hex
          qmk_firmware/*.bin
          qmk_firmware/*.uf2
