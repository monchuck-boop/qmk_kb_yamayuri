name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Verify Keyboards Directory and Branch
      run: |
        cd qmk_firmware
        echo "=== Current Git Branch ==="
        git branch -a
        echo "=== Keyboards Folder List ==="
        ls -la keyboards/
        if [ -d "keyboards/keyball61" ]; then
          echo "✅ keyball61 folder successfully found."
        else
          echo "❌ ERROR: keyball61 folder not found in keyboards/ directory."
        fi

    - name: Fix Python Dependencies
      run: |
        cd qmk_firmware
        # エラーログの指示に従い、QMKの内部Python環境に必要な依存ライブラリを強制インストールします
        /opt/uv/tools/qmk/bin/python3 -m pip install --break-system-packages -r requirements.txt appdirs

    - name: Run QMK Compile
      run: |
        cd qmk_firmware
        # QMK環境を初期化して、ビルドを実行します
        qmk setup -y
        qmk compile -kb keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-firmware
        path: qmk_firmware/.build/*.hex
