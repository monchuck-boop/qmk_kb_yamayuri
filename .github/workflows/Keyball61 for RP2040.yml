name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python and Dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies and Compile
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util
        cd qmk_firmware
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk appdirs
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        # フォルダを正しい位置に配置
        if [ -d "keyball_rp2040" ]; then
          cp -r keyball_rp2040 keyboards/
        fi

        echo "=== Tweaking rules.mk for RP2040 compatibility ==="
        # AVR用ブートローダーの誤認識を防ぎ、RP2040として確実に処理させるための設定をrules.mkに強制注入します
        TARGET_RULES="keyboards/keyball_rp2040/rules.mk"
        if [ -f "$TARGET_RULES" ]; then
          echo "MCU = RP2040" >> "$TARGET_RULES"
          echo "BOOTLOADER = rp2040" >> "$TARGET_RULES"
        fi
        
        SUB_RULES="keyboards/keyball_rp2040/keyball61/rules.mk"
        if [ -f "$SUB_RULES" ]; then
          echo "MCU = RP2040" >> "$SUB_RULES"
          echo "BOOTLOADER = rp2040" >> "$SUB_RULES"
        fi

        echo "=== Starting QMK Compile ==="
        # 内部パーサーの警告やミスマッチをバイパスするため、直接makeコマンドに環境変数を渡してビルドを叩きます
        qmk compile -kb keyball_rp2040/keyball61 -km default || make keyball_rp2040/keyball61:default MCU=RP2040 BOOTLOADER=rp2040

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-firmware
        path: |
          qmk_firmware/*.hex
          qmk_firmware/*.bin
          qmk_firmware/*.uf2
