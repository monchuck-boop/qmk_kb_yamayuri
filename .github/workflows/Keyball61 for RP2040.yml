name: Build QMK Firmware (Clean Environment)

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. 【環境リセット】最新・クリーンなQMK公式本家リポジトリ本体（最新版）をクローン
    - name: Checkout Official QMK Firmware
      uses: actions/checkout@v4
      with:
        repository: 'qmk/qmk_firmware'
        ref: 'master' # 最新の本家コアを使用
        path: 'qmk_firmware'
        submodules: recursive

    # 2. あなたのカスタムキーボード設定データ（yamaryu211ブランチ）を別ディレクトリにダウンロード
    - name: Checkout User Keyboard Config
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'user_config'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk appdirs

    # 3. 【正規のインポート】あなたのキーボードフォルダだけを、公式QMKの「keyboards/」以下に正しくマッピング
    - name: Import Keyboard to QMK Environment
      run: |
        # あなたのリポジトリ直下にある keyball_rp2040 フォルダのみを、本家QMKのkeyboards以下にクリーンにコピーします
        if [ -d "user_config/keyball_rp2040" ]; then
          cp -r user_config/keyball_rp2040 qmk_firmware/keyboards/
          echo "✅ keyball_rp2040 successfully imported to QMK keyboards directory."
        else
          echo "❌ ERROR: keyball_rp2040 directory not found in user repo!"
          exit 1
        fi

    # 4. Gitの安全設定を適用し、QMKを初期化して標準ビルドを実行
    - name: Run Clean QMK Compile
      run: |
        cd qmk_firmware
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        # 本家の正常なビルドパイプラインを通じてコンパイルを実行
        qmk compile -kb keyball_rp2040/keyball61 -km default

    # 5. 成果物のビルド完了ファイルの吸い出し
    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-clean-firmware
        path: |
          qmk_firmware/.build/*.hex
          qmk_firmware/.build/*.bin
          qmk_firmware/.build/*.uf2
