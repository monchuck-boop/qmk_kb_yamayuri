name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python and Dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies and Compile
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util
        cd qmk_firmware
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk appdirs
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        # 1. フォルダの正しい配置
        if [ -d "keyball_rp2040" ]; then
          cp -r keyball_rp2040 keyboards/
        fi

        echo "=== Patching config.h and rules.mk for Keyball61 RP2040 ==="
        # 2. QMKの古いパーサー対策として、info.jsonをkeyboards直下にも配置
        cp keyboards/keyball_rp2040/keyball61/info.json keyboards/keyball_rp2040/info.json || true
        
        # 3. rules.mk に正しいRP2040用のMCUターゲット(Cortex-M0+)を設定
        TARGET_RULES="keyboards/keyball_rp2040/rules.mk"
        if [ -f "$TARGET_RULES" ]; then
          echo "MCU = RP2040" >> "$TARGET_RULES"
          echo "BOOTLOADER = rp2040" >> "$TARGET_RULES"
        fi
        
        SUB_RULES="keyboards/keyball_rp2040/keyball61/rules.mk"
        if [ -f "$SUB_RULES" ]; then
          echo "MCU = RP2040" >> "$SUB_RULES"
          echo "BOOTLOADER = rp2040" >> "$SUB_RULES"
        fi

        # 4. LED未定義エラー (RGBLED_NUM) の回避用パッチをconfig.hに強制注入
        CONFIG_FILE="keyboards/keyball_rp2040/keyball61/config.h"
        if [ -f "$CONFIG_FILE" ]; then
          echo "" >> "$CONFIG_FILE"
          echo "#ifndef RGBLED_NUM" >> "$CONFIG_FILE"
          echo "#define RGBLED_NUM 0" >> "$CONFIG_FILE" # 一旦0個としてエラーを回避(keymap側等で上書きされます)
          echo "#endif" >> "$CONFIG_FILE"
        fi

        echo "=== Starting QMK Compile ==="
        # 5. コンパイルを実行
        qmk compile -kb keyball_rp2040/keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-firmware
        path: |
          qmk_firmware/*.hex
          qmk_firmware/*.bin
          qmk_firmware/*.uf2
