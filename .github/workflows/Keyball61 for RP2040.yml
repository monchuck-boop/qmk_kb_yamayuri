name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util

    - name: Install QMK CLI and Dependencies
      run: |
        cd qmk_firmware
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        python3 -m pip install appdirs

    - name: Fix Directory Structure and Run Compile
      run: |
        cd qmk_firmware
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        echo "=== Checking Keyboard Directory Layout ==="
        # もしリポジトリのルートにあるkeyboardsフォルダ内にkeyball61があるのにQMKが認識しない場合、
        # QMKのホーム直下の正しい位置にフォルダをリンク/移動させます。
        if [ -d "keyboards/keyball61" ]; then
          echo "Found keyball61 in repository root."
        else
          echo "keyball61 not found in repository root. Checking subfolders..."
          ls -la keyboards/ || true
        fi
        
        # QMKコンパイルを実行
        qmk compile -kb keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-firmware
        path: |
          qmk_firmware/*.hex
          qmk_firmware/*.bin
          qmk_firmware/*.uf2
