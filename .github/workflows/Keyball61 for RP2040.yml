name: Build Keyball61 RP2040 Firmware

on:
  push:
    branches: [ "yamaryu211" ]
  pull_request:
    branches: [ "yamaryu211" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest

    steps:
    - name: Checkout keyboard repository
      uses: actions/checkout@v4
      with:
        path: keyboards/keyball

    - name: Checkout QMK Firmware
      uses: actions/checkout@v4
      with:
        repository: qmk/qmk_firmware
        submodules: recursive
        path: qmk_firmware

    - name: Setup environment
      run: |
        # 自身のソースコード（keyball61フォルダを含むリポジトリ）をQMKのしかるべき配置に移動
        # ※もしリポジトリ直下がkeyball61ではなく別の構造の場合はここを調整します
        if [ -d "keyboards/keyball/keyball61" ]; then
          mv keyboards/keyball/keyball61 qmk_firmware/keyboards/
        else
          mv keyboards/keyball qmk_firmware/keyboards/keyball61
        fi
        
        cd qmk_firmware
        qmk setup -y

    - name: Compile Firmware
      run: |
        cd qmk_firmware
        # RP2040ビルド：ブートローダー指定を伴うコンパイル、またはrp2040ターゲットの指定
        # 一般的なKeyballのRP2040ビルドコマンド（環境に応じて default や vial 等に変更してください）
        qmk compile -kb keyball61 -km default

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-firmware
        path: |
          qmk_firmware/*.uf2
          qmk_firmware/*.bin
