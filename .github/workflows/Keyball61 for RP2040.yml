name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python and Dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies and Compile
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util
        cd qmk_firmware
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk appdirs
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        # 1. keyboardsフォルダへ展開
        if [ -d "keyball_rp2040" ]; then
          cp -r keyball_rp2040 keyboards/
        fi

        cp keyboards/keyball_rp2040/keyball61/info.json keyboards/keyball_rp2040/info.json || true
        
        # 2. rules.mk にビルドターゲットを設定
        TARGET_RULES="keyboards/keyball_rp2040/rules.mk"
        if [ -f "$TARGET_RULES" ]; then
          echo "MCU = RP2040" >> "$TARGET_RULES"
          echo "BOOTLOADER = rp2040" >> "$TARGET_RULES"
        fi
        
        SUB_RULES="keyboards/keyball_rp2040/keyball61/rules.mk"
        if [ -f "$SUB_RULES" ]; then
          echo "MCU = RP2040" >> "$SUB_RULES"
          echo "BOOTLOADER = rp2040" >> "$SUB_RULES"
        fi

        # 3. 【ディープパッチ①】見つかるすべての config.h に必須定義を強制注入
        echo "=== Deep Patching all config.h files ==="
        find . -name "config.h" -type f | while read -r file; do
          echo "Injecting to: $file"
          echo "" >> "$file"
          echo "#define KEYBALL_61" >> "$file"
          echo "#define RGBLED_NUM 9" >> "$file"
          echo "#define NOP_FUDGE 2" >> "$file"
          echo "#define VENDOR_ID 0x1209" >> "$file"
          echo "#define PRODUCT_ID 0x2320" >> "$file"
          echo "#define DEVICE_VER 0x0001" >> "$file"
          echo "#define MANUFACTURER \"Yushakobo\"" >> "$file"
          echo "#define PRODUCT \"Keyball61 RP2040\"" >> "$file"
        done

        # 4. 【ディープパッチ②】見つかるすべての keyball.c のエラー行を物理破壊＆先頭定義
        echo "=== Deep Patching all keyball.c files ==="
        find . -name "keyball.c" -type f | while read -r file; do
          echo "Patching: $file"
          # OS自動判別の無効化
          sed -i 's/if (detected_host_os() == OS_WINDOWS || detected_host_os() == OS_LINUX)/if (1)/g' "$file"
          # エラーを発生させている #error 構文をコメントアウトして物理的に無効化
          sed -i 's/#    error("unknown Keyball model")/\/\/ bypassed/g' "$file"
          sed -i 's/#   error("unknown Keyball model")/\/\/ bypassed/g' "$file"
          # ファイルの最上行に KEYBALL_61 を強制定義
          sed -i '1s/^/#define KEYBALL_61\n/' "$file"
        done

        # 5. keyball61.h へのレイアウトマクロ補正
        KEYBALL_H="keyboards/keyball_rp2040/keyball61/keyball61.h"
        if [ -f "$KEYBALL_H" ]; then
          echo "" >> "$KEYBALL_H"
          echo "#ifndef LAYOUT_universal" >> "$KEYBALL_H"
          echo "#define LAYOUT_universal( \\" >> "$KEYBALL_H"
          echo "    K00, K01, K02, K03, K04, K05, K06, K07, K08, K09, K0a, K0b, K0c, K0d, K0e, K0f, \\" >> "$KEYBALL_H"
          echo "    K10, K11, K12, K13, K14, K15, K16, K17, K18, K19, K1a, K1b, K1c, K1d, K1e, K1f, \\" >> "$KEYBALL_H"
          echo "    K20, K21, K22, K23, K24, K25, K26, K27, K28, K29, K2a, K2b, K2c, K2d, K2e, K2f, \\" >> "$KEYBALL_H"
          echo "    K30, K31, K32, K33, K34, K35, K36, K37, K38, K39, K3a, K3b, K3c, K3d, K3e, K3f  \\" >> "$KEYBALL_H"
          echo ") \\" >> "$KEYBALL_H"
          echo "{ \\" >> "$KEYBALL_H"
          echo "    { K00, K01, K02, K03, K04, K05, K06, K07 }, \\" >> "$KEYBALL_H"
          echo "    { K08, K09, K0a, K0b, K0c, K0d, K0e, K0f }, \\" >> "$KEYBALL_H"
          echo "    { K10, K11, K12, K13, K14, K15, K16, K17 }, \\" >> "$KEYBALL_H"
          echo "    { K18, K19, K1a, K1b, K1c, K1d, K1e, K1f }, \\" >> "$KEYBALL_H"
          echo "    { K20, K21, K22, K23, K24, K25, K26, K27 }, \\" >> "$KEYBALL_H"
          echo "    { K28, K29, K2a, K2b, K2c, K2d, K2e, K2f }, \\" >> "$KEYBALL_H"
          echo "    { K30, K31, K32, K33, K34, K35, K36, K37 }, \\" >> "$KEYBALL_H"
          echo "    { K38, K39, K3a, K3b, K3c, K3d, K3e, K3f }  \\" >> "$KEYBALL_H"
          echo "}" >> "$KEYBALL_H"
          echo "#endif" >> "$KEYBALL_H"
        fi

        # 6. コンパイルを実行
        qmk compile -kb keyball_rp2040/keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-firmware
        path: |
          qmk_firmware/.build/*.hex
          qmk_firmware/.build/*.bin
          qmk_firmware/.build/*.uf2
