name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch: # 手動実行も可能にします

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest # QMK公式のビルド環境を使用

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Verify Keyboards Directory and Branch
      run: |
        cd qmk_firmware
        echo "=== Current Git Branch ==="
        git branch -a
        echo "=== Keyboards Folder List ==="
        ls -la keyboards/
        # keyball61フォルダが存在するかチェック
        if [ -d "keyboards/keyball61" ]; then
          echo "✅ keyball61 folder successfully found."
        else
          echo "❌ ERROR: keyball61 folder not found in keyboards/ directory."
        fi

    - name: Run QMK Compile
      run: |
        cd qmk_firmware
        # QMKの環境設定を初期化
        qmk setup -y
        # コンパイルを実行 (キーマップ名を適宜変更してください。ここでは default としています)
        qmk compile -kb keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-firmware
        path: qmk_firmware/.build/*.hex # または *.bin (コントローラーの種類に合わせて自動作成されたファイルが対象)
