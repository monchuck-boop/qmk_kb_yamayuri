name: Build QMK Firmware

on:
  push:
    branches:
      - yamaryu211
  pull_request:
    branches:
      - yamaryu211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout qmk_firmware
      uses: actions/checkout@v4
      with:
        repository: 'monchuck-boop/qmk_kb_yamayuri'
        ref: 'yamaryu211'
        path: 'qmk_firmware'
        submodules: recursive

    - name: Set up Python and Dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies and Compile
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi git dfu-programmer dfu-util
        cd qmk_firmware
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk appdirs
        if [ -f "requirements.txt" ]; then
          python3 -m pip install -r requirements.txt
        fi
        git config --global --add safe.directory $(pwd)
        qmk setup -y
        
        # 1. フォルダの正しい配置
        if [ -d "keyball_rp2040" ]; then
          cp -r keyball_rp2040 keyboards/
        fi

        echo "=== Patching config.h and rules.mk for Keyball61 RP2040 ==="
        mkdir -p keyboards/keyball_rp2040/keyball61
        cp keyboards/keyball_rp2040/keyball61/info.json keyboards/keyball_rp2040/info.json || true
        
        # 2. rules.mk に正しいRP2040用ターゲットを設定
        TARGET_RULES="keyboards/keyball_rp2040/rules.mk"
        if [ -f "$TARGET_RULES" ]; then
          echo "MCU = RP2040" >> "$TARGET_RULES"
          echo "BOOTLOADER = rp2040" >> "$TARGET_RULES"
        fi
        
        SUB_RULES="keyboards/keyball_rp2040/keyball61/rules.mk"
        if [ -f "$SUB_RULES" ]; then
          echo "MCU = RP2040" >> "$SUB_RULES"
          echo "BOOTLOADER = rp2040" >> "$SUB_RULES"
        fi

        # 3. LED未定義エラー (RGBLED_NUM) の回避用パッチ
        CONFIG_FILE="keyboards/keyball_rp2040/keyball61/config.h"
        if [ -f "$CONFIG_FILE" ]; then
          echo "" >> "$CONFIG_FILE"
          echo "#ifndef RGBLED_NUM" >> "$CONFIG_FILE"
          echo "#define RGBLED_NUM 0" >> "$CONFIG_FILE"
          echo "#endif" >> "$CONFIG_FILE"
        fi

        echo "=== Patching keyball.c to bypass OS Detection function ==="
        # 4. 'detected_host_os' 周りのエラー箇所を置換
        KEYBALL_C="keyboards/keyball_rp2040/lib/keyball/keyball.c"
        if [ -f "$KEYBALL_C" ]; then
          sed -i 's/if (detected_host_os() == OS_WINDOWS || detected_host_os() == OS_LINUX)/if (1)/g' "$KEYBALL_C"
        fi

        echo "=== Injecting LAYOUT_universal macro ==="
        # 5. QMKコアから認識されない 'LAYOUT_universal' マクロの実体をCマクロの形に変換して強制定義します
        KEYBALL_H="keyboards/keyball_rp2040/keyball61/keyball61.h"
        if [ -f "$KEYBALL_H" ]; then
          echo "" >> "$KEYBALL_H"
          echo "#ifndef LAYOUT_universal" >> "$KEYBALL_H"
          echo "#define LAYOUT_universal( \\" >> "$KEYBALL_H"
          echo "    L00, L01, L02, L03, L04, L05,           R00, R01, R02, R03, R04, R05, \\" >> "$KEYBALL_H"
          echo "    L10, L11, L12, L13, L14, L15,           R10, R11, R12, R13, R14, R15, \\" >> "$KEYBALL_H"
          echo "    L20, L21, L22, L23, L24, L25,           R20, R21, R22, R23, R24, R25, \\" >> "$KEYBALL_H"
          echo "    L30, L31, L32, L33, L34, L35, L36, R36, R30, R31, R32, R33, R34, R35  \\" >> "$KEYBALL_H"
          echo ") \\" >> "$KEYBALL_H"
          echo "{ \\" >> "$KEYBALL_H"
          echo "    { L00, L01, L02, L03, L04, L05, KC_NO }, \\" >> "$KEYBALL_H"
          echo "    { L10, L11, L12, L13, L14, L15, KC_NO }, \\" >> "$KEYBALL_H"
          echo "    { L20, L21, L22, L23, L24, L25, L36   }, \\" >> "$KEYBALL_H"
          echo "    { L30, L31, L32, L33, L34, L35, KC_NO }, \\" >> "$KEYBALL_H"
          echo "    { R05, R04, R03, R02, R01, R00, KC_NO }, \\" >> "$KEYBALL_H"
          echo "    { R15, R14, R13, R12, R11, R10, KC_NO }, \\" >> "$KEYBALL_H"
          echo "    { R25, R24, R23, R22, R21, R20, R36   }, \\" >> "$KEYBALL_H"
          echo "    { R35, R34, R33, R32, R31, R30, KC_NO }  \\" >> "$KEYBALL_H"
          echo "}" >> "$KEYBALL_H"
          echo "#endif" >> "$KEYBALL_H"
        fi

        echo "=== Starting QMK Compile ==="
        # 6. コンパイルを実行
        qmk compile -kb keyball_rp2040/keyball61 -km default

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-firmware
        path: |
          qmk_firmware/.build/*.hex
          qmk_firmware/.build/*.bin
          qmk_firmware/.build/*.uf2
