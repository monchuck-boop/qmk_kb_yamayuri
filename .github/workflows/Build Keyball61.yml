name: Build Keyball61 for RP2040

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch: # GitHub上で手動実行するためのボタンを設置

jobs:
  build-rp2040:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # QMK本体や依存サブモジュールを同時に取得

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install QMK CLI & ARM Toolchain
      run: |
        python3 -m pip install --upgrade pip
        pip3 install qmk
        # RP2040のビルドに必要なGCC ARMコンパイラ一式をUbuntu環境に導入
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Initialize QMK
      run: |
        qmk setup -y

    - name: Symlink Keyboard to QMK Environment
      run: |
        # リポジトリ内の ble-micro-pro フォルダを QMK の keyboards 以下にリンク
        # (キーボードフォルダ構造に応じて `yamayuri` など適切な配下に配置します)
        mkdir -p ~/qmk_firmware/keyboards/yamayuri
        ln -s "$GITHUB_WORKSPACE/ble-micro-pro" ~/qmk_firmware/keyboards/yamayuri/keyball61

    - name: Compile RP2040 Firmware
      run: |
        # RP2040用のコンパイルを実行します。
        # キーボード名(yamayuri/keyball61)やキーマップ(default)は環境に合わせて調整してください。
        # ※ rules.mk 側で「BOOTLOADER = rp2040」等の指定が正しく入っている想定です。
        qmk compile -kb yamayuri/keyball61 -km default

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-uf2
        path: |
          ~/qmk_firmware/*.uf2
          ~/qmk_firmware/*.bin
