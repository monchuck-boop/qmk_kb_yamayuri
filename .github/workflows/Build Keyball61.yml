name: Build Keyball61 for RP2040

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch: # 手動実行用

permissions:
  contents: read

jobs:
  build-rp2040:
    runs-on: ubuntu-latest

    steps:
    # ▼▼▼ チェックアウトの修正版 ▼▼▼
    - name: Checkout repository
      uses: actions/checkout@v4  # v4に更新してNodeの警告を抑制
      with:
        submodules: recursive
        persist-credentials: false # コンテナ内でのGit認証エラー(128)を回避する設定
    # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install QMK CLI & ARM Toolchain
      run: |
        python3 -m pip install --upgrade pip
        pip3 install qmk
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Initialize QMK
      run: |
        qmk setup -y

    - name: Symlink Keyboard to QMK Environment
      run: |
        mkdir -p ~/qmk_firmware/keyboards/yamayuri
        ln -s "$GITHUB_WORKSPACE/ble-micro-pro" ~/qmk_firmware/keyboards/yamayuri/keyball61

    - name: Compile RP2040 Firmware
      run: |
        qmk compile -kb yamayuri/keyball61 -km default

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-rp2040-uf2
        path: |
          ~/qmk_firmware/*.uf2
          ~/qmk_firmware/*.bin
